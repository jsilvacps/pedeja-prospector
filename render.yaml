services:
  - type: web
    name: disparador-conteudo
    runtime: python
    rootDir: webapp
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers=1 --threads=8 --timeout=300 --bind=0.0.0.0:$PORT app:app
    disk:
      name: dados
      mountPath: /var/data
      sizeGB: 1          # ~$0,25/mês — guarda uploads, DB e config
    envVars:
      - key: RENDER
        value: "true"
      - key: DATA_DIR
        value: /var/data
      - key: EVO_URL
        sync: false
      - key: EVO_TOKEN
        sync: false
      - key: EVO_INSTANCE
        sync: false
      - key: IG_USER_ID
        sync: false
      - key: IG_TOKEN
        sync: false
      - key: APP_URL
        sync: false
    autoDeploy: true
